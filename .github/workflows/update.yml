name: Обновить расписание
on:
  schedule:
    - cron: '17 * * * *'   # каждый час
  workflow_dispatch:        # кнопка «Run workflow» для ручного запуска
  push:
    paths: ['rasp.xlsx']    # если загрузить таблицу вручную
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python scripts/update.py
      - name: Сохранить, если расписание изменилось
        run: |
          git config user.name "puls-bot"
          git config user.email "puls-bot@users.noreply.github.com"
          git add data.json status.json
          git diff --cached --quiet || (git commit -m "Проверка расписания" && git push)
